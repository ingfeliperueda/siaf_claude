//  :  hielo (resbala)   l  lava (quema)   |  puerta del jefe (se cierra al entrar)
//  Y Yeti Gigante · K Reina de Escarcha · U Araña Sombra · X Rey de las Sombras · J Gólem de Magma · Z Dragón del Núcleo
const WORLD_LEVEL_NAMES = [
  ["La Entrada Helada", "El Túnel de Carámbanos", "La Gruta Escarchada", "El Lago Congelado", "La Guarida del Yeti",
   "Los Pasillos de Escarcha", "La Cascada de Hielo", "El Glaciar Hueco", "Las Minas Nevadas", "El Palacio de Escarcha"],
  ["El Bosque de Setas", "Los Senderos Oscuros", "La Cueva de las Luciérnagas", "Las Raíces Retorcidas", "El Nido de la Araña Sombra",
   "El Pantano Negro", "Las Ruinas Olvidadas", "El Laberinto de Sombras", "La Puerta Oscura", "El Trono de las Sombras"],
  ["Las Grietas Ardientes", "El Río de Lava", "La Fragua Antigua", "Los Géiseres", "La Forja del Gólem",
   "Las Cenizas Eternas", "El Puente de Obsidiana", "La Cámara del Magma", "Las Puertas del Núcleo", "El Corazón del Abismo"],
];
const WORLD_POOLS = ["tkqosp", "fnoxtke", "eqpkoxt"];
const WORLD_BOSSES = [["Y", "K"], ["U", "X"], ["J", "Z"]];
function genWorldLevel(w, n) {
  const PICKS = "SMIALDWNCF", boss = n === 4 || n === 9 ? WORLD_BOSSES[w][n === 4 ? 0 : 1] : null;
  for (let attempt = 0; attempt < 60; attempt++) {
    let seed = 7919 * (w + 2) + 104729 * n + attempt * 31337 + 17;
    const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1)), pick = a => a[Math.floor(rnd() * a.length)];
    const cols = 4, rows = 3, cw = 11, ch = 9, W = cols * cw + 1, H = rows * ch + 1;
    const m = Array.from({ length: H }, () => Array(W).fill("#"));
    const N = cols * rows, cx = i => i % cols, cy = i => Math.floor(i / cols);
    // árbol que une todas las salas
    const adj = Array.from({ length: N }, () => []), seenC = new Array(N).fill(false), stack = [ri(0, N - 1)], edges = [];
    const start = stack[0]; seenC[start] = true;
    while (stack.length) {
      const c = stack[stack.length - 1];
      const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [cx(c) + dx, cy(c) + dy]).filter(([x, y]) => x >= 0 && y >= 0 && x < cols && y < rows).map(([x, y]) => y * cols + x).filter(j => !seenC[j]);
      if (!nb.length) { stack.pop(); continue; }
      const j = pick(nb); seenC[j] = true; adj[c].push(j); adj[j].push(c); edges.push([c, j]); stack.push(j);
    }
    const depth = new Array(N).fill(-1), par = new Array(N).fill(-1), q = [start]; depth[start] = 0;
    while (q.length) { const c = q.shift(); for (const j of adj[c]) if (depth[j] < 0) { depth[j] = depth[c] + 1; par[j] = c; q.push(j); } }
    let exitC = 0; for (let i = 0; i < N; i++) if (depth[i] > depth[exitC]) exitC = i;
    if (depth[exitC] < 3) continue;
    // salas
    const rooms = [];
    for (let i = 0; i < N; i++) {
      const big = i === exitC && boss, rw = big ? cw - 2 : ri(5, cw - 3), rh = big ? ch - 2 : ri(4, ch - 3);
      const rx = cx(i) * cw + 1 + ri(0, cw - 1 - rw - 1) + (big ? 0 : 0), ry = cy(i) * ch + 1 + ri(0, ch - 1 - rh - 1);
      const r = { x: rx, y: ry, w: rw, h: rh, c: i }; r.mx = rx + Math.floor(rw / 2); r.my = ry + Math.floor(rh / 2); rooms.push(r);
      for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++) m[y][x] = ".";
    }
    // pasillos entre salas vecinas, con la casilla de la frontera apuntada para poner puertas
    const edgeDoor = {};
    for (const [a, b] of edges) {
      const A = rooms[a], B = rooms[b];
      let x = A.mx, y = A.my;
      while (x !== B.mx) { m[y][x] = "."; x += Math.sign(B.mx - x); }
      while (y !== B.my) { m[y][x] = "."; y += Math.sign(B.my - y); }
      let dpos;
      if (cy(a) === cy(b)) dpos = [Math.max(cx(a), cx(b)) * cw, A.my];
      else dpos = [B.mx, Math.max(cy(a), cy(b)) * ch];
      edgeDoor[a + "," + b] = edgeDoor[b + "," + a] = dpos;
    }
    // camino hasta la salida y candados por orden
    const path = []; for (let c = exitC; c !== start; c = par[c]) path.unshift([par[c], c]);
    const lockable = boss ? path.slice(0, -1) : path.slice(0);
    const nLocks = Math.min(lockable.length, n < 2 ? 1 : n < 6 ? 2 : 3), colors = ["r", "b", "v"];
    const lockIdx = []; const pool = lockable.map((_, i) => i).slice(0); while (lockIdx.length < nLocks) lockIdx.push(pool.splice(ri(0, pool.length - 1), 1)[0]);
    lockIdx.sort((a, b) => a - b);
    const cut = new Set(lockIdx.map(i => lockable[i][0] + "," + lockable[i][1]));
    const zoneOf = blockedEdge => { const z = new Set([start]), qq = [start]; while (qq.length) { const c = qq.shift(); for (const j of adj[c]) { if (blockedEdge.has(c + "," + j) || blockedEdge.has(j + "," + c) || z.has(j)) continue; z.add(j); qq.push(j); } } return z; };
    const freeTile = (r, avoidMid) => { for (let k = 0; k < 40; k++) { const x = ri(r.x, r.x + r.w - 1), y = ri(r.y, r.y + r.h - 1); if (m[y][x] !== ".") continue; if (avoidMid && (x === r.mx || y === r.my)) continue; return [x, y]; } return null; };
    let prevZone = new Set(), okKeys = true;
    lockIdx.forEach((li, k) => {
      const [a, b] = lockable[li], col = colors[k];
      const blocked = new Set([...cut].filter(e => { const i = lockIdx.findIndex(x => lockable[x][0] + "," + lockable[x][1] === e); return i >= k; }));
      const zone = zoneOf(blocked), cand = [...zone].filter(c => !prevZone.has(c) && c !== start);
      const cs = cand.length ? cand : [...zone];
      cs.sort((p, q2) => depth[q2] - depth[p]);
      const room = rooms[cs[Math.min(cs.length - 1, ri(0, 1))]], t = freeTile(room, true) || freeTile(room, false);
      if (!t) { okKeys = false; return; }
      m[t[1]][t[0]] = col;
      const [dx, dy] = edgeDoor[a + "," + b]; m[dy][dx] = col.toUpperCase();
      prevZone = zone;
    });
    if (!okKeys) continue;
    const S = rooms[start], X = rooms[exitC];
    m[S.my][S.mx] = "P";
    if (boss) {
      const [a, b] = path[path.length - 1], [gx, gy] = edgeDoor[a + "," + b]; m[gy][gx] = "|";
      m[X.my][X.mx] = boss;
      // la salida, en la esquina de la arena más lejana a la puerta
      const corners = [[X.x + 1, X.y + 1], [X.x + X.w - 2, X.y + 1], [X.x + 1, X.y + X.h - 2], [X.x + X.w - 2, X.y + X.h - 2]];
      corners.sort((p, q2) => Math.hypot(q2[0] - gx, q2[1] - gy) - Math.hypot(p[0] - gx, p[1] - gy));
      m[corners[0][1]][corners[0][0]] = "E";
    } else m[X.my][X.mx] = "E";
    // peligros de cada mundo (nunca en la fila ni la columna central de una sala, para no cerrar el paso)
    for (const r of rooms) {
      if (r.c === start || (boss && r.c === exitC)) continue;
      for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) {
        if (m[y][x] !== ".") continue;
        const mid = x === r.mx || y === r.my, v = Math.sin(x * 0.9 + n * 3.1) + Math.cos(y * 1.1 - w * 2.3) + rnd() * 0.8;
        if (w === 0 && v > 0.9) m[y][x] = ":";
        if (w === 1 && !mid && v > 1.75) m[y][x] = "w";
        if (w === 2 && !mid && v > 1.55) m[y][x] = "l";
        if (w === 2 && !mid && v < -1.75) m[y][x] = "^";

  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  const worldT = (c, k = 1) => { c.setTransform(DPR * CZ * k, 0, 0, DPR * CZ * k, 0, 0); c.translate(-camX + sx + camKick.x, -camY + sy + camKick.y); };
  worldT(ctx);
  blitView(tileCache);

  const x0 = Math.max(0, Math.floor(camX / TS) - 1), x1 = Math.min(W - 1, Math.ceil((camX + vw) / TS) + 1);
  const y0 = Math.max(0, Math.floor(camY / TS) - 1), y1 = Math.min(H - 1, Math.ceil((camY + vh) / TS) + 1);
  const inView = (x, y, m = 40) => x > camX - m && x < camX + vw + m && y > camY - m && y < camY + vh + m;

  // casillas dinámicas
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const t = T(x, y), px = x * TS, py = y * TS;
    if (t === DOOR) drawDoor(px, py, KEYS[doorCol[y * W + x]].c, doorCol[y * W + x]);
    else if (t === EXIT) drawExit(px, py);
    else if (t === CRACK) drawCrack(px, py, x, y);
    else if (t === SPIKE) drawSpike(px, py, x, y);
    else if (t === WEB) drawWeb(px, py, x, y);
    else if (t === LAVA) drawLava(px, py, x, y);
    else if (t === GATE) drawGate(px, py, x, y);
    else if (t === PORTAL) drawPortal(px, py, x, y);
    else if (t === CRATE) drawCrate(px, py, thp[y * W + x]);
    else if (t === WATER) {
      ctx.strokeStyle = "rgba(150,215,255,0.11)"; ctx.lineWidth = 1;
      for (let l = 0; l < 3; l++) {
        const yy = py + 5 + l * 10;
        ctx.beginPath();
        for (let s = 0; s <= 8; s++) { const wx = px + s * 4, wy = yy + Math.sin(wx * 0.18 + gameT * 1.6 + l * 2 + y) * 2 + Math.sin(wx * 0.07 - gameT) * 1.5; s ? ctx.lineTo(wx, wy) : ctx.moveTo(wx, wy); }
        ctx.stroke();
      }
      const k = (gameT * 0.4 + hash(x, y)) % 1;
      ctx.fillStyle = `rgba(220,240,255,${0.22 * Math.sin(k * Math.PI)})`;
      ctx.fillRect(px + hash(x * 5, y) * 24, py + hash(x, y * 5) * 26, 3, 1);
    }
  }
  for (const d of doorAnims) {
    const k = d.t / 0.6;
    ctx.globalAlpha = 1 - k; ctx.fillStyle = "#5a4029";
    for (let i = 0; i < 4; i++) ctx.fillRect(d.x + 2 + i * 7.5, d.y + 2 - k * 28, 6, (TS - 4) * (1 - k));
    ctx.globalAlpha = 1;
  }
  for (const tq of torches) if (inView(tq.x, tq.y)) drawTorch(tq);
  for (const d of decor) if (d.kind !== "puddle" && inView(d.x, d.y)) drawDecor(d);
  for (const d of decor) if (d.kind === "puddle" && inView(d.x, d.y)) {
    const k = (gameT * 0.6 + d.ph) % 3;
    if (k < 1) { ctx.strokeStyle = `rgba(160,200,255,${0.25 * (1 - k)})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(d.x, d.y, 3 + k * 9, 2 + k * 5, 0, 0, 7); ctx.stroke(); }
  }
  // manchas y dardos
  for (const d of decals) {
    if (!inView(d.x, d.y)) continue;
    if (d.kind === "splat") { ctx.globalAlpha = 0.35; ctx.fillStyle = d.c; blob(d.x, d.y, d.r, d.a); }
    else if (d.kind === "trail") { ctx.globalAlpha = 0.25 * Math.min(1, d.life / 2); ctx.fillStyle = d.c; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill(); }
    else { ctx.save(); ctx.globalAlpha = Math.min(1, d.life / 2); ctx.translate(d.x, d.y); ctx.rotate(d.a); drawDartShape(d.c, d.tip); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  for (const it of items) if (inView(it.x, it.y)) drawItem(it);
  for (const p of pops) {
    const k = p.t / 0.45, e = ease(k);
    ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(p.it.x, p.it.y - e * 24); ctx.scale(1 + e * 0.9, 1 + e * 0.9); ctx.translate(-p.it.x, -p.it.y);
    drawItem(p.it); ctx.restore();
  }
  for (const b of bouncers) {
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(b.x, b.y + 1, 4, 1.5, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(b.x, b.y - b.z); ctx.rotate(b.rot); drawDartShape(b.c, b.tip); ctx.restore();
  }
  // avisos de ataque
  for (const m of monsters) {
    if (m.type === "q" && m.slam > 0) {
      const k = 1 - m.slam / 0.7;
      ctx.strokeStyle = `rgba(229,72,77,${0.3 + k * 0.5})`; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.arc(m.x, m.y, 88, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = `rgba(229,72,77,${0.08 + k * 0.12})`; ctx.beginPath(); ctx.arc(m.x, m.y, 88 * k, 0, 7); ctx.fill();
    }
    if (m.type === "o" && m.wind > 0) {
      const L = rayLen(m.x, m.y, m.ca, 520), k = 1 - m.wind / 0.95;
      ctx.strokeStyle = `rgba(255,40,60,${0.25 + k * 0.55})`; ctx.lineWidth = 0.8 + k * 1.6; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + Math.cos(m.ca) * L, m.y + Math.sin(m.ca) * L); ctx.stroke(); ctx.setLineDash([]);
    }
    if (m.def.boss && m.wind > 0) {
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.ca);
      ctx.fillStyle = `rgba(229,72,77,${0.15 + 0.15 * Math.sin(time * 30)})`; ctx.fillRect(0, -m.r, 420, m.r * 2);
      ctx.restore();
    }
  }
  for (const c of clouds) {
    const a = Math.min(1, c.life / 0.6) * 0.38;
    for (let i = 0; i < 6; i++) {
      const bx = c.x + Math.cos(c.ph + i * 1.05 + gameT * 0.4) * c.r * 0.45, by = c.y + Math.sin(c.ph + i * 1.05 + gameT * 0.4) * c.r * 0.3, br = c.r * (0.45 + 0.1 * Math.sin(gameT * 2 + i));
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, br); g.addColorStop(0, `rgba(160,95,220,${a})`); g.addColorStop(1, "rgba(120,60,180,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fill();
    }
  }
  const ents = monsters.slice().sort((a, b) => a.y - b.y);
  let playerDrawn = false;
  for (const m of ents) {
    if (!playerDrawn && m.y > P.y) { drawPlayer(); playerDrawn = true; }
    if (inView(m.x, m.y)) drawMonster(m);
  }
  if (!playerDrawn) drawPlayer();
  for (const d of dying) {
    const k = d.t / d.dur, s = Math.max(0.02, 1 + k * 0.35 - k * k * 1.3);
    ctx.save(); ctx.globalAlpha = 1 - k * k; ctx.translate(d.m.x, d.m.y); ctx.rotate(k * (d.m.def.boss ? 0.5 : 2.4) * d.spin); ctx.scale(s, s); ctx.translate(-d.m.x, -d.m.y);
    d.m.flash = Math.floor(d.t * 28) % 2 ? 1 : 0; d.m.t += frameDt * 2;
    drawMonster(d.m); ctx.restore();
  }
  // reflejos húmedos que brillan cuando les llega tu luz
  ctx.globalCompositeOperation = "lighter";
  for (const w of wetSpots) {
    if (!inView(w.x, w.y, 10)) continue;
    const d = Math.hypot(w.x - P.x, w.y - P.y); if (d > 240) continue;
    const a = (1 - d / 240) * Math.pow(0.5 + 0.5 * Math.sin(time * 2.2 + w.ph + (P.x + P.y) * 0.02), 3);
    if (a < 0.03) continue;
    ctx.fillStyle = `rgba(220,235,255,${a * 0.8})`; ctx.beginPath(); ctx.ellipse(w.x, w.y, 2.2, 0.9, 0, 0, 7); ctx.fill();
    ctx.fillRect(w.x - 0.3, w.y - 2.2, 0.6, 4.4);
  }
  ctx.globalCompositeOperation = "source-over";
  for (const m of motes) { ctx.fillStyle = `rgba(255,240,210,${0.25 + 0.2 * Math.sin(time * 2 + m.ph)})`; ctx.fillRect(m.x, m.y, m.s, m.s); }
  for (const d of drops) { ctx.strokeStyle = "rgba(170,215,255,0.7)"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(d.x, d.y - d.z); ctx.lineTo(d.x, d.y - d.z - 5); ctx.stroke(); ctx.fillStyle = `rgba(0,0,0,${0.25 * (1 - d.z / 150)})`; ctx.beginPath(); ctx.ellipse(d.x, d.y, 1.8, 0.8, 0, 0, 7); ctx.fill(); }
  for (const p of projs) drawProj(p);
  for (const r of rings) { ctx.globalAlpha = Math.max(0, r.life * 2.5); ctx.strokeStyle = r.c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1; drawRocks(); drawPet(); drawPuzzle(); drawArenaMarks(); drawWaves();
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalAlpha = 1;

  // niebla: zonas nunca vistas
  ctx.fillStyle = "#050407";
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (!seen[y * W + x]) ctx.fillRect(x * TS - 0.5, y * TS - 0.5, TS + 1, TS + 1);

  // ---- oscuridad e iluminación ----
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.globalCompositeOperation = "source-over";
  lctx.fillStyle = "rgba(3,2,6,0.95)"; lctx.fillRect(0, 0, lc.width, lc.height);
  lctx.globalCompositeOperation = "destination-out";
  worldT(lctx, LS);
  const light = (x, y, r, k = 1) => {
    const g = lctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${k})`); g.addColorStop(0.5, `rgba(0,0,0,${k * 0.75})`); g.addColorStop(1, "rgba(0,0,0,0)");
    lctx.fillStyle = g; lctx.beginPath(); lctx.arc(x, y, r, 0, 7); lctx.fill();
  };
  // luz del jugador recortada por los muros: halo + linterna del casco
  lctx.save();
  lctx.beginPath();
  for (let i = 0; i < visPolyPts.length; i += 2) i ? lctx.lineTo(visPolyPts[i], visPolyPts[i + 1]) : lctx.moveTo(visPolyPts[0], visPolyPts[1]);
  lctx.closePath(); lctx.clip();
  const fl = Math.sin(time * 9) * 4 + Math.sin(time * 23) * 3;
  const dk = darkK();
  light(P.x, P.y, (150 + fl) * (dk < 1 ? 0.62 : 1));
  const cg = lctx.createRadialGradient(P.x, P.y, 10, P.x, P.y, 330 * dk);
  cg.addColorStop(0, "rgba(0,0,0,0.95)"); cg.addColorStop(0.55, "rgba(0,0,0,0.7)"); cg.addColorStop(1, "rgba(0,0,0,0)");
  lctx.fillStyle = cg; lctx.beginPath(); lctx.moveTo(P.x, P.y); lctx.arc(P.x, P.y, 330 * dk, P.aim - 0.48, P.aim + 0.48); lctx.closePath(); lctx.fill();
  if (pet) light(pet.x, pet.y, 90, 0.7);
  for (const r of rocks) if (r.t > 0) light(r.x, r.y, 26, 0.4);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (T(x, y) === CRACK) light(x * TS + 16, y * TS + 16, 70, 0.55);
  lctx.restore();
  for (const tq of torches) if (inView(tq.x, tq.y, 140)) light(tq.x, tq.y + 10, 128 + Math.sin(time * 8 + tq.ph) * 6, 0.9);
  for (const d of decor) if (d.kind !== "puddle" && inView(d.x, d.y, 90)) light(d.x, d.y, 70 + Math.sin(time * 2 + d.ph) * 5, 0.65);
  for (const p of projs) if (p.kind === "rocket" || p.kind === "orb") light(p.x, p.y, 60, 0.7);
  for (const f of flashes) light(f.x, f.y, f.r, Math.min(1, f.life * 4));
  for (const it of items) if (it.kind === "key" || it.kind === "weapon") light(it.x, it.y, 46, 0.6);
  for (const e of exits) light(e.x, e.y, 85, 0.75);
  for (const l of emiLights) if (inView(l.x, l.y, l.r)) light(l.x, l.y, l.r * (l.flick ? 0.92 + 0.08 * Math.sin(time * 11 + l.x) : 1), l.k);
  if (P.muzzle > 0) light(P.x + Math.cos(P.aim) * 20, P.y + Math.sin(P.aim) * 20, 90, 0.8);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(lc, 0, 0, cv.width, cv.height);

  // resplandores de color
  worldT(ctx);
  ctx.globalCompositeOperation = "lighter";
  gctx.setTransform(1, 0, 0, 1, 0, 0); gctx.globalCompositeOperation = "source-over"; gctx.clearRect(0, 0, gcv.width, gcv.height);
  gctx.globalCompositeOperation = "lighter"; worldT(gctx, LS);
  const glow = (x, y, r, c, a) => {
    const g = gctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`);
    gctx.fillStyle = g; gctx.beginPath(); gctx.arc(x, y, r, 0, 7); gctx.fill();
  };
  for (const tq of torches) if (inView(tq.x, tq.y, 120)) glow(tq.x, tq.y + 8, 110, "255,140,40", 0.15 + Math.sin(time * 9 + tq.ph) * 0.02);
  for (const d of decor) if (d.kind === "mush" && inView(d.x, d.y, 80)) glow(d.x, d.y, 60, "60,220,230", 0.13);
  for (const d of decor) if (d.kind === "crystal" && inView(d.x, d.y, 80)) glow(d.x, d.y, 70, d.hue === 190 ? "80,200,255" : d.hue === 320 ? "255,90,200" : "170,90,255", 0.15 + Math.sin(time * 2 + d.ph) * 0.04);
  for (const e of exits) glow(e.x, e.y, 70, "90,200,255", 0.14 + Math.sin(time * 3) * 0.04);
  // capa emisiva: lava, cristales y runas brillan aunque esté oscuro
  ctx.globalAlpha = 0.85 + 0.15 * Math.sin(time * 1.7);
  blitView(emi);
  ctx.globalAlpha = 1;
  for (const l of emiLights) if (inView(l.x, l.y, l.r)) glow(l.x, l.y, l.r * 0.75, l.c, 0.1 + (l.flick ? 0.03 * Math.sin(time * 9 + l.y) : 0));
  ctx.globalCompositeOperation = "source-over";
  for (const c of candles) if (inView(c.x, c.y)) drawCandleFlame(c);
  ctx.globalCompositeOperation = "lighter";
  for (const p of projs) { if (p.kind === "rocket") glow(p.x, p.y, 40, "255,80,170", 0.35); else if (p.kind === "orb") glow(p.x, p.y, 26, "255,110,50", 0.4); }
  for (const f of flashes) glow(f.x, f.y, f.r * 0.6, "255,200,120", Math.min(0.5, f.life * 2));
  for (const m of monsters) if (m.type === "o" && m.beam > 0) {
    const k = m.beam / 0.18, ex = m.x + Math.cos(m.ca) * m.beamLen, ey = m.y + Math.sin(m.ca) * m.beamLen;
    ctx.lineCap = "round";
    ctx.strokeStyle = `rgba(255,60,90,${0.7 * k})`; ctx.lineWidth = 8 * k; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = `rgba(255,235,240,${k})`; ctx.lineWidth = 2.5 * k; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.lineCap = "butt";
  }
  for (const m of monsters) if (m.def.ghost) glow(m.x, m.y, 26, "170,215,255", 0.12 * (m.vis ?? 1));
  for (const p of parts) if (p.glow) glow(p.x, p.y, 8, "255,210,120", 0.25 * p.life / p.max);
  for (const g of glints) { ctx.fillStyle = `rgba(255,255,220,${g.life * 2})`; ctx.fillRect(g.x - 0.5, g.y - 2, 1, 4); ctx.fillRect(g.x - 2, g.y - 0.5, 4, 1); }
  if (P.muzzle > 0) glow(P.x + Math.cos(P.aim) * 20, P.y + Math.sin(P.aim) * 20, 26, "255,230,150", 0.6);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(gcv, 0, 0, cv.width, cv.height); ctx.restore();
  ctx.globalCompositeOperation = "source-over";

  // la niebla vuelve a tapar lo no explorado (para que los brillos no revelen el mapa)
  ctx.fillStyle = "#050407";
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (!seen[y * W + x]) ctx.fillRect(x * TS - 0.5, y * TS - 0.5, TS + 1, TS + 1);
  // avisos de los ataques de los jefes, por encima de la oscuridad para que siempre se vean
  drawBossTells(); ctx.globalAlpha = 1;
  // textos flotantes
  ctx.textAlign = "center";
  for (const t of texts) {
    const pop = 1 + clamp((t.life - 1) / 0.2, 0, 1) * 0.7;
    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(pop, pop);
    ctx.font = `bold ${t.size}px system-ui, sans-serif`;
    ctx.globalAlpha = Math.min(1, t.life * 2.5);
    ctx.fillStyle = "#000"; ctx.fillText(t.txt, 1, 1); ctx.fillStyle = t.c; ctx.fillText(t.txt, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  drawCompass(vw, vh);

  // pantalla: resplandor, gradación de color y grano
  postFX(sx, sy);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, VW, VH);
  if (hurtFlash > 0 || (P.hp <= 2 && state === "play")) {
    const a = Math.max(hurtFlash * 1.2, P.hp <= 2 ? 0.18 + 0.12 * Math.sin(time * 6.5) : 0);
    const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.3, VW / 2, VH / 2, Math.max(VW, VH) * 0.7);
    g.addColorStop(0, "rgba(229,72,77,0)"); g.addColorStop(1, `rgba(229,72,77,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  }
  if (state === "play" || state === "pause") drawHUD();
  if (settings.minimap === 2 && mini && state === "play") {
    const mw = Math.min(VW - 40, 760), mh = Math.min(VH - 200, 520), sc = Math.max(3, Math.min(mw / W, mh / H));
    drawMiniMap(VW / 2 - mw / 2, VH / 2 - mh / 2 - 20, mw, mh, sc, false);
  }
  if (touch.on && state === "play") drawTouch();
  if (state === "play") { drawCombo(); drawTutorialPanel(); drawWorldCard(); drawPuzzleHud(); drawBossIntro(); }
  drawPowerBadges(); drawPowerPop();
  if (fade > 0) { ctx.fillStyle = `rgba(5,4,7,${fade})`; ctx.fillRect(0, 0, VW, VH); }
  if (state === "pause") drawPause();
  if (state === "dead") drawDead();
  if (state === "levelDone") drawLevelDone();
  if (state === "win") drawWin();
}

// Resplandor: se dibujan solo las fuentes de luz en un búfer pequeño, se difumina reduciéndolo y se suma a la imagen
function postFX(sx, sy) {
  if (!settings.fx) return;
  const k = bl1.width / VW;
  b1.setTransform(1, 0, 0, 1, 0, 0); b1.globalCompositeOperation = "source-over"; b1.globalAlpha = 1;
  b1.fillStyle = "#000"; b1.fillRect(0, 0, bl1.width, bl1.height);
  b1.setTransform(k * CZ, 0, 0, k * CZ, 0, 0); b1.translate(-camX + sx + camKick.x, -camY + sy + camKick.y);
  b1.globalCompositeOperation = "lighter";
  const vw = VW / CZ, vh = VH / CZ, inV = (x, y) => x > camX - 60 && x < camX + vw + 60 && y > camY - 60 && y < camY + vh + 60;
  const dot = (x, y, r, c, a) => { const g = b1.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`); b1.fillStyle = g; b1.beginPath(); b1.arc(x, y, r, 0, 7); b1.fill(); };
  if (emiSmall) b1.drawImage(emiSmall, 0, 0, W * TS, H * TS);
  for (const t of torches) if (inV(t.x, t.y)) dot(t.x, t.y - 2, 16 + Math.sin(time * 9 + t.ph) * 1.5, "255,150,50", 0.9);
  for (const c of candles) if (inV(c.x, c.y)) dot(c.x, c.y - 3, 7, "255,180,90", 0.8);
  for (const d of decor) if (d.kind !== "puddle" && inV(d.x, d.y)) dot(d.x, d.y, 12, d.kind === "mush" ? "70,230,235" : (CRYSTAL_RGB[d.hue] || "180,110,255"), 0.6);

const MUS = { mode: "", t: 0, step: 0 };
const LEVEL_ROOTS = [57, 50, 54, 52, 49, 55, 53, 48, 56, 45];
const MINOR_PENT = [0, 3, 5, 7, 10, 12, 15];
const TITLE_SONG = [[69, 1], [72, 1], [76, 2], [74, 1], [72, 1], [71, 2], [69, 1], [67, 1], [69, 2], [64, 2],
  [69, 1], [72, 1], [76, 2], [79, 1], [77, 1], [76, 2], [74, 1], [72, 1], [71, 2], [69, 2], [0, 2]];

               ending: [[60, 64, 67, 72], [55, 59, 62, 67], [57, 60, 64, 69], [53, 57, 60, 65]] };
const END_MELODY = [72, 0, 76, 79, 0, 77, 76, 74, 72, 0, 74, 76, 0, 79, 77, 76];
function musicMode() {
  if (state === "title" || state === "custom" || state === "ach" || state === "options" || state === "access" || state === "chars" || state === "map") return "title";
  if (state === "story") return story.pages === ENDING ? "ending" : "story";
  if (state === "win") return "ending";

}
function updateMusic(dt) {
  const mode = musicMode();

    if (mode === "ending" && END_MELODY[st % 16]) tone(NOTE(END_MELODY[st % 16]), step * 1.8, "square", 0.018, 0.01, 2400);

["De repente, la tierra tembló... ¡y Chispa cayó por una grieta hacia el abismo!", "Suddenly the ground shook... and Sparky fell through a crack into the abyss!", "De repente, a terra tremeu... e a Faísca caiu por uma fenda no abismo!", "Soudain, la terre trembla... et Étincelle tomba dans une faille vers l'abîme !", "Plötzlich bebte die Erde... und Funke fiel durch eine Spalte in den Abgrund!", "All'improvviso la terra tremò... e Scintilla cadde in una crepa verso l'abisso!"],
["Allí abajo reina el malvado Rey Ogro, que ha encerrado a Chispa junto a su trono.", "Down there rules the evil Ogre King, who has locked Sparky up next to his throne.", "Lá embaixo reina o malvado Rei Ogro, que prendeu a Faísca ao lado do trono.", "En bas règne le méchant Roi Ogre, qui a enfermé Étincelle près de son trône.", "Dort unten herrscht der böse Oger-König, der Funke neben seinem Thron eingesperrt hat.", "Laggiù regna il malvagio Re Orco, che ha rinchiuso Scintilla accanto al suo trono."],
["{0} se puso el casco de minero y cargó sus dardos de espuma.", "{0} put on the miner helmet and loaded the foam darts.", "{0} colocou o capacete de mineiro e carregou os dardos de espuma.", "{0} enfila le casque de mineur et chargea ses fléchettes en mousse.", "{0} setzte den Grubenhelm auf und lud die Schaumpfeile.", "{0} indossò il casco da minatore e caricò i dardi di gommapiuma."],

["Tras una batalla épica, el Rey Ogro cayó derrotado. ¡{0} lo había conseguido!", "After an epic battle, the Ogre King fell. {0} had done it!", "Depois de uma batalha épica, o Rei Ogro caiu. {0} conseguiu!", "Après un combat épique, le Roi Ogre tomba. {0} avait réussi !", "Nach einem epischen Kampf fiel der Oger-König. {0} hatte es geschafft!", "Dopo una battaglia epica, il Re Orco cadde. {0} ce l'aveva fatta!"],

  if (state === "play" && settings.fx && fxAuto && raw < 0.5) {
    slowT = raw > 1 / 38 ? slowT + raw : Math.max(0, slowT - raw * 0.5);
    if (slowT > 4) { settings.fx = false; fxAuto = false; showToast("Efectos reducidos para que el juego vaya más fluido (puedes cambiarlo en Pausa)", 4); }
  }
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
