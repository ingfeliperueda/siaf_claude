let VW, VH, DPR, ZOOM, vignette = null;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cv.width = lc.width = Math.round(VW * DPR);
  cv.height = lc.height = Math.round(VH * DPR);
  ZOOM = Math.max(1, Math.min(2.2, Math.min(VW / (TS * 15), VH / (TS * 10))));
  vignette = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
  vignette.addColorStop(0, "rgba(0,0,0,0)"); vignette.addColorStop(1, "rgba(0,0,0,0.6)");
}
addEventListener("resize", resize);

// ---------- Sonido ----------
let AC = null, master = null, sfxBus = null, musBus = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = settings.sound ? 1 : 0; master.connect(AC.destination);
      sfxBus = AC.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      musBus = AC.createGain(); musBus.gain.value = 0.55; musBus.connect(master);
      startAmbience();
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === "suspended") AC.resume();
}
function setSound(on) { settings.sound = on; store.set("sound", on); if (master) master.gain.value = on ? 1 : 0; }
function beep(f, dur, type = "square", vol = 0.06, slide = 0, bus) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.08, freq = 800, type = "highpass", bus) {
  if (!AC) return;
  const n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = b; f.type = type; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(bus || sfxBus); s.start();
}

  if (state !== "play") { const t = e.changedTouches[0]; clickUI(t.clientX, t.clientY); return; }
  const B = btns();
  for (const t of e.changedTouches) {
    const x = t.clientX, y = t.clientY;
    if (inBtn(B.pause, x, y)) { pause(); continue; }
    if (inBtn(B.swap, x, y)) { cycleWeapon(1); continue; }
    if (inBtn(B.reload, x, y)) { startReload(); continue; }
    if (inBtn(B.dash, x, y)) { wantDash = true; continue; }
    if (x > VW * 0.5) { touch.fire = true; touch.fireId = t.identifier; touch.fs = { x, y }; touch.aim = null; continue; }
    if (!touch.joy) touch.joy = { id: t.identifier, ox: x, oy: y, x, y };
  }
}, { passive: false });
cv.addEventListener("touchmove", e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (touch.joy && t.identifier === touch.joy.id) { touch.joy.x = t.clientX; touch.joy.y = t.clientY; }
    if (t.identifier === touch.fireId && touch.fs) {
      const dx = t.clientX - touch.fs.x, dy = t.clientY - touch.fs.y;

    }
  }
}, { passive: false });
const tend = e => {
  for (const t of e.changedTouches) {
    if (touch.joy && t.identifier === touch.joy.id) touch.joy = null;
    if (t.identifier === touch.fireId) { touch.fire = false; touch.fireId = null; touch.aim = null; }
  }
};
cv.addEventListener("touchend", tend); cv.addEventListener("touchcancel", tend);

// Mapa de flujo: distancia de cada casilla al jugador, para que los monstruos esquiven muros
function computeFlow() {

    const ang = a + s, sp = w.speed * (w.darts > 1 ? rand(0.85, 1.1) : 1);

}

// ---------- Actualización ----------
function update(rdt) {
  time += rdt;
  updateAudio(rdt);
  if (state !== "play") { updateFx(rdt * 0.5); return; }
  let dt = rdt;
  if (hitstop > 0) { hitstop -= rdt; dt = rdt * 0.12; }
  gameT += dt; lv.time += dt; run.time += dt;
  banner -= rdt; toast.t -= rdt; fade = Math.max(0, fade - rdt * 2); hurtFlash = Math.max(0, hurtFlash - rdt);
  shake = Math.max(0, shake - rdt * 30);

  updatePlayer(dt);
  computeFlow();
  updateMonsters(dt);
  updateProjs(dt);
  updateItems(dt);
  updateFx(dt);

  const ptx = Math.floor(P.x / TS), pty = Math.floor(P.y / TS);
  if (T(ptx, pty) === EXIT && state === "play") finishLevel();
}

function updatePlayer(dt) {
  P.inv -= dt; P.cd -= dt; P.dashCd -= dt; P.muzzle -= dt; P.recoil = Math.max(0, P.recoil - dt * 8);
  if (P.reloading > 0) { P.reloading -= dt; if (P.reloading <= 0) { P.ammo[curId()] = curW().clip; SFX.reloaded(); } }

  let mx = 0, my = 0;
  if (keys.KeyW || keys.ArrowUp) my -= 1;
  if (keys.KeyS || keys.ArrowDown) my += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (touch.joy) {
    const jx = touch.joy.x - touch.joy.ox, jy = touch.joy.y - touch.joy.oy, jd = Math.hypot(jx, jy);

  const onWeb = T(ptx, pty) === WEB;
  if (onWeb) hint("web", "Las telarañas te frenan. ¡Los cohetes las queman!", 3);

  }
  wantDash = false;

  let vx, vy;
  if (P.dash > 0) {
    P.dash -= dt; vx = P.dvx; vy = P.dvy;
    ghosts.push({ x: P.x, y: P.y, life: 0.22 });
  } else {
    const sp = P.speed * (onWeb ? 0.45 : 1);
    vx = mx * sp; vy = my * sp;
  }

function visPoly(px, py, R) {

  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const t = T(x, y), px = x * TS, py = y * TS;
    if (t === DOOR) drawDoor(px, py, KEYS[doorCol[y * W + x]].c, doorCol[y * W + x]);
    else if (t === EXIT) drawExit(px, py);
    else if (t === CRACK) drawCrack(px, py, x, y);
    else if (t === SPIKE) drawSpike(px, py, x, y);
    else if (t === WEB) drawWeb(px, py, x, y);
    else if (t === CRATE) drawCrate(px, py, thp[y * W + x]);
    else if (t === WATER) {
      const k = (gameT * 0.5 + hash(x, y)) % 1;
      ctx.fillStyle = `rgba(150,210,255,${0.12 * Math.sin(k * Math.PI)})`;
      ctx.fillRect(px + hash(x * 5, y) * 18, py + ((k * TS + y * 7) % TS), 10, 1.5);
      ctx.fillRect(px + 4 + hash(x, y * 5) * 16, py + (((k + 0.5) % 1) * TS), 7, 1);
    }
  }
  for (const d of doorAnims) {
    const k = d.t / 0.6;
    ctx.globalAlpha = 1 - k; ctx.fillStyle = "#5a4029";
    for (let i = 0; i < 4; i++) ctx.fillRect(d.x + 2 + i * 7.5, d.y + 2 - k * 28, 6, (TS - 4) * (1 - k));
    ctx.globalAlpha = 1;
  }
  for (const tq of torches) if (inView(tq.x, tq.y)) drawTorch(tq);
  for (const d of decor) if (d.kind !== "puddle" && inView(d.x, d.y)) drawDecor(d);
  for (const d of decor) if (d.kind === "puddle" && inView(d.x, d.y)) {
    const k = (gameT * 0.6 + d.ph) % 3;
    if (k < 1) { ctx.strokeStyle = `rgba(160,200,255,${0.25 * (1 - k)})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(d.x, d.y, 3 + k * 9, 2 + k * 5, 0, 0, 7); ctx.stroke(); }
  }
  // manchas y dardos
  for (const d of decals) {
    if (!inView(d.x, d.y)) continue;
    if (d.kind === "splat") { ctx.globalAlpha = 0.35; ctx.fillStyle = d.c; blob(d.x, d.y, d.r, d.a); }
    else if (d.kind === "trail") { ctx.globalAlpha = 0.25 * Math.min(1, d.life / 2); ctx.fillStyle = d.c; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill(); }
    else { ctx.save(); ctx.globalAlpha = Math.min(1, d.life / 2); ctx.translate(d.x, d.y); ctx.rotate(d.a); drawDartShape(d.c); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  for (const it of items) if (inView(it.x, it.y)) drawItem(it);
  // avisos de ataque
  for (const m of monsters) {
    if (m.type === "q" && m.slam > 0) {
      const k = 1 - m.slam / 0.7;
      ctx.strokeStyle = `rgba(229,72,77,${0.3 + k * 0.5})`; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.arc(m.x, m.y, 88, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = `rgba(229,72,77,${0.08 + k * 0.12})`; ctx.beginPath(); ctx.arc(m.x, m.y, 88 * k, 0, 7); ctx.fill();
    }
    if (m.def.boss && m.wind > 0) {
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.ca);
      ctx.fillStyle = `rgba(229,72,77,${0.15 + 0.15 * Math.sin(time * 30)})`; ctx.fillRect(0, -m.r, 420, m.r * 2);
      ctx.restore();
    }
  }
  const ents = monsters.slice().sort((a, b) => a.y - b.y);
  let playerDrawn = false;
  for (const m of ents) {
    if (!playerDrawn && m.y > P.y) { drawPlayer(); playerDrawn = true; }
    if (inView(m.x, m.y)) drawMonster(m);
  }
  if (!playerDrawn) drawPlayer();
  for (const p of projs) drawProj(p);
  for (const r of rings) { ctx.globalAlpha = Math.max(0, r.life * 2.5); ctx.strokeStyle = r.c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalAlpha = 1;

  // niebla: zonas nunca vistas
  ctx.fillStyle = "#050407";
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (!seen[y * W + x]) ctx.fillRect(x * TS - 0.5, y * TS - 0.5, TS + 1, TS + 1);

  // ---- oscuridad e iluminación ----
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.globalCompositeOperation = "source-over";
  lctx.fillStyle = "rgba(3,2,6,0.95)"; lctx.fillRect(0, 0, lc.width, lc.height);
  lctx.globalCompositeOperation = "destination-out";
  worldT(lctx);
  const light = (x, y, r, k = 1) => {
    const g = lctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${k})`); g.addColorStop(0.5, `rgba(0,0,0,${k * 0.75})`); g.addColorStop(1, "rgba(0,0,0,0)");
    lctx.fillStyle = g; lctx.beginPath(); lctx.arc(x, y, r, 0, 7); lctx.fill();
  };
  // luz del jugador recortada por los muros: halo + linterna del casco
  lctx.save();
  lctx.beginPath();
  for (let i = 0; i < visPolyPts.length; i += 2) i ? lctx.lineTo(visPolyPts[i], visPolyPts[i + 1]) : lctx.moveTo(visPolyPts[0], visPolyPts[1]);
  lctx.closePath(); lctx.clip();
  const fl = Math.sin(time * 9) * 4 + Math.sin(time * 23) * 3;
  light(P.x, P.y, 150 + fl);
  const cg = lctx.createRadialGradient(P.x, P.y, 10, P.x, P.y, 330);
  cg.addColorStop(0, "rgba(0,0,0,0.95)"); cg.addColorStop(0.55, "rgba(0,0,0,0.7)"); cg.addColorStop(1, "rgba(0,0,0,0)");
  lctx.fillStyle = cg; lctx.beginPath(); lctx.moveTo(P.x, P.y); lctx.arc(P.x, P.y, 330, P.aim - 0.48, P.aim + 0.48); lctx.closePath(); lctx.fill();
  lctx.restore();
  for (const tq of torches) if (inView(tq.x, tq.y, 140)) light(tq.x, tq.y + 10, 128 + Math.sin(time * 8 + tq.ph) * 6, 0.9);
  for (const d of decor) if (d.kind !== "puddle" && inView(d.x, d.y, 90)) light(d.x, d.y, 70 + Math.sin(time * 2 + d.ph) * 5, 0.65);
  for (const p of projs) if (p.kind === "rocket" || p.kind === "orb") light(p.x, p.y, 60, 0.7);
  for (const f of flashes) light(f.x, f.y, f.r, Math.min(1, f.life * 4));
  for (const it of items) if (it.kind === "key" || it.kind === "weapon") light(it.x, it.y, 46, 0.6);
  for (const e of exits) light(e.x, e.y, 85, 0.75);
  if (P.muzzle > 0) light(P.x + Math.cos(P.aim) * 20, P.y + Math.sin(P.aim) * 20, 90, 0.8);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(lc, 0, 0);

  // resplandores de color
  worldT(ctx);
  ctx.globalCompositeOperation = "lighter";
  const glow = (x, y, r, c, a) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  };
  for (const tq of torches) if (inView(tq.x, tq.y, 120)) glow(tq.x, tq.y + 8, 110, "255,140,40", 0.15 + Math.sin(time * 9 + tq.ph) * 0.02);
  for (const d of decor) if (d.kind === "mush" && inView(d.x, d.y, 80)) glow(d.x, d.y, 60, "60,220,230", 0.13);
  for (const d of decor) if (d.kind === "crystal" && inView(d.x, d.y, 80)) glow(d.x, d.y, 70, d.hue === 190 ? "80,200,255" : d.hue === 320 ? "255,90,200" : "170,90,255", 0.15 + Math.sin(time * 2 + d.ph) * 0.04);
  for (const e of exits) glow(e.x, e.y, 70, "90,200,255", 0.14 + Math.sin(time * 3) * 0.04);
  for (const p of projs) { if (p.kind === "rocket") glow(p.x, p.y, 40, "255,80,170", 0.35); else if (p.kind === "orb") glow(p.x, p.y, 26, "255,110,50", 0.4); }
  for (const f of flashes) glow(f.x, f.y, f.r * 0.6, "255,200,120", Math.min(0.5, f.life * 2));
  for (const p of parts) if (p.glow) glow(p.x, p.y, 8, "255,210,120", 0.25 * p.life / p.max);
  for (const g of glints) { ctx.fillStyle = `rgba(255,255,220,${g.life * 2})`; ctx.fillRect(g.x - 0.5, g.y - 2, 1, 4); ctx.fillRect(g.x - 2, g.y - 0.5, 4, 1); }
  if (P.muzzle > 0) glow(P.x + Math.cos(P.aim) * 20, P.y + Math.sin(P.aim) * 20, 26, "255,230,150", 0.6);
  ctx.globalCompositeOperation = "source-over";

  // textos flotantes
  ctx.textAlign = "center";
  for (const t of texts) {
    ctx.font = `bold ${t.size}px system-ui, sans-serif`;
    ctx.globalAlpha = Math.min(1, t.life * 2.5);
    ctx.fillStyle = "#000"; ctx.fillText(t.txt, t.x + 1, t.y + 1); ctx.fillStyle = t.c; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  drawCompass(vw, vh);

  // pantalla
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, VW, VH);
  if (hurtFlash > 0 || (P.hp <= 2 && state === "play")) {
    const a = Math.max(hurtFlash * 1.2, P.hp <= 2 ? 0.18 + 0.12 * Math.sin(time * 6.5) : 0);
    const g = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.3, VW / 2, VH / 2, Math.max(VW, VH) * 0.7);
    g.addColorStop(0, "rgba(229,72,77,0)"); g.addColorStop(1, `rgba(229,72,77,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  }
  if (state === "play" || state === "pause") drawHUD();
  if (touch.on && state === "play") drawTouch();
  if (fade > 0) { ctx.fillStyle = `rgba(5,4,7,${fade})`; ctx.fillRect(0, 0, VW, VH); }
  if (state === "pause") drawPause();
  if (state === "dead") drawDead();
  if (state === "levelDone") drawLevelDone();
  if (state === "win") drawWin();
}

// Flechas que guían hacia la puerta de la llave que llevas
function drawCompass(vw, vh) {
  for (const c of KEY_ORDER) {
    if (!P.keys[c]) continue;
    let bestD = 1e9, bx = 0, by = 0;
    for (const k in doorCol) {
      const i = +k; if (tiles[i] !== DOOR || doorCol[i] !== c || !seen[i]) continue;
      const x = (i % W) * TS + 16, y = ((i / W) | 0) * TS + 16, d = Math.hypot(x - P.x, y - P.y);
      if (d < bestD) { bestD = d; bx = x; by = y; }
    }
    if (bestD === 1e9) continue;
    const onScreen = bx > camX + 20 && bx < camX + vw - 20 && by > camY + 20 && by < camY + vh - 20;
    ctx.save();
    if (onScreen) { ctx.translate(bx, by - 26 + Math.sin(time * 5) * 3); ctx.rotate(Math.PI / 2); }
    else {
      const a = Math.atan2(by - P.y, bx - P.x), r = Math.min(vw, vh) * 0.42;
      ctx.translate(P.x + Math.cos(a) * r, P.y + Math.sin(a) * r); ctx.rotate(a);
    }
    ctx.globalAlpha = 0.85; ctx.fillStyle = KEYS[c].c; ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-6, -7); ctx.lineTo(-3, 0); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

function blob(x, y, r, a) {
  ctx.beginPath();
  for (let i = 0; i <= 10; i++) { const t = i / 10 * Math.PI * 2, rr = r * (0.7 + 0.3 * Math.sin(t * 3 + a)); ctx.lineTo(x + Math.cos(t) * rr, y + Math.sin(t) * rr); }
  ctx.fill();
}
function drawDartShape(c) {
  ctx.fillStyle = c; ctx.fillRect(-6, -1.6, 9, 3.2);
  ctx.fillStyle = "#ff6a00"; ctx.beginPath(); ctx.arc(4, 0, 2.3, 0, 7); ctx.fill();
}
function drawDoor(px, py, c, k) {
  ctx.fillStyle = "#3b2a1c"; ctx.fillRect(px, py, TS, TS);
  ctx.fillStyle = "#5a4029"; for (let i = 0; i < 4; i++) ctx.fillRect(px + 2 + i * 7.5, py + 2, 6, TS - 4);
  ctx.fillStyle = "rgba(0,0,0,0.25)"; for (let i = 0; i < 4; i++) ctx.fillRect(px + 7 + i * 7.5, py + 2, 1, TS - 4);
  ctx.fillStyle = c; ctx.fillRect(px, py + 6, TS, 4); ctx.fillRect(px, py + TS - 10, TS, 4);
  ctx.fillStyle = "#c9b48a"; for (let i = 0; i < 4; i++) { ctx.fillRect(px + 4 + i * 7.5, py + 7, 2, 2); ctx.fillRect(px + 4 + i * 7.5, py + TS - 9, 2, 2); }
  ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.strokeRect(px + 1, py + 1, TS - 2, TS - 2);
  ctx.fillStyle = "#d9c79a"; ctx.beginPath(); ctx.arc(px + 16, py + 16, 6, 0, 7); ctx.fill();
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(px + 16, py + 15, 2.5, 0, 7); ctx.fill(); ctx.fillRect(px + 15, py + 15, 2, 5);
  const has = P.keys[k] > 0;
  ctx.globalAlpha = (has ? 0.35 : 0.18) + (has ? 0.25 : 0.12) * Math.sin(time * (has ? 6 : 3)); ctx.fillStyle = c; ctx.fillRect(px, py, TS, TS); ctx.globalAlpha = 1;
}
function drawExit(px, py) {
  ctx.fillStyle = "#000"; ctx.fillRect(px + 2, py + 2, TS - 4, TS - 4);
  for (let i = 0; i < 5; i++) { ctx.fillStyle = `hsl(200, 25%, ${32 - i * 5}%)`; ctx.fillRect(px + 4 + i * 2, py + 4 + i * 5, TS - 8 - i * 4, 4); }
  ctx.strokeStyle = `rgba(120,220,255,${0.5 + 0.3 * Math.sin(time * 4)})`; ctx.lineWidth = 2; ctx.strokeRect(px + 1, py + 1, TS - 2, TS - 2);
  for (let i = 0; i < 3; i++) { const k = (time * 0.6 + i / 3) % 1; ctx.fillStyle = `rgba(150,230,255,${0.6 * (1 - k)})`; ctx.fillRect(px + 6 + i * 9, py + 26 - k * 22, 2, 2); }
}
function drawCrack(px, py, x, y) {
  const h = hash(x, y), hp = thp[y * W + x];
  ctx.fillStyle = `hsl(25, 14%, ${12 + h * 4}%)`; ctx.fillRect(px, py, TS, TS);
  ctx.fillStyle = `hsl(25, 18%, ${19 + h * 5}%)`; ctx.fillRect(px, py + TS * 0.45, TS, TS * 0.55);
  ctx.strokeStyle = "rgba(0,0,0,0.75)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(px + 6, py + 4); ctx.lineTo(px + 13, py + 13); ctx.lineTo(px + 10, py + 20); ctx.lineTo(px + 17, py + 28);
  ctx.moveTo(px + 13, py + 13); ctx.lineTo(px + 22, py + 11); ctx.lineTo(px + 27, py + 18);
  if (hp < 4) { ctx.moveTo(px + 22, py + 11); ctx.lineTo(px + 25, py + 3); ctx.moveTo(px + 10, py + 20); ctx.lineTo(px + 3, py + 24); }
  if (hp < 2) { ctx.moveTo(px + 17, py + 28); ctx.lineTo(px + 26, py + 26); ctx.moveTo(px + 13, py + 13); ctx.lineTo(px + 15, py + 2); }
  ctx.stroke();
  ctx.strokeStyle = `rgba(255,210,120,${0.08 + 0.06 * Math.sin(time * 2)})`; ctx.lineWidth = 1; ctx.stroke();
}
function drawSpike(px, py, x, y) {
  const ph = spikePhase(x, y), up = ph < 0.75, warn = ph > 2.25;
  if (!up && !warn) return;
  const h = up ? (ph < 0.08 ? ph / 0.08 : ph > 0.65 ? (0.75 - ph) / 0.1 : 1) : 0.2 + Math.sin(time * 60) * 0.1;
  ctx.fillStyle = "#c9ccd3"; ctx.strokeStyle = "#5c606a"; ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
    const cx = px + 9 + i * 7, cy = py + 9 + j * 7;
    ctx.beginPath(); ctx.moveTo(cx - 2.5, cy + 1.5); ctx.lineTo(cx, cy + 1.5 - 8 * h); ctx.lineTo(cx + 2.5, cy + 1.5); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function drawWeb(px, py, x, y) {
  const h = hash(x + 3, y + 7);
  ctx.save(); ctx.translate(px + 16, py + 16); ctx.rotate(h * 6);
  ctx.strokeStyle = "rgba(230,230,240,0.32)"; ctx.lineWidth = 0.8;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 17, Math.sin(a) * 17); }
  for (let r = 5; r < 17; r += 4) { for (let i = 0; i <= 8; i++) { const a = i / 8 * Math.PI * 2; const rr = r + Math.sin(i * 2.3) * 1.2; i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } }
  ctx.stroke(); ctx.restore();
}
function drawCrate(px, py, hp) {
  ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(px + 4, py + 24, 26, 6);
  ctx.fillStyle = "#8a5f33"; ctx.fillRect(px + 3, py + 3, TS - 6, TS - 6);
  ctx.fillStyle = "#a87842"; for (let i = 0; i < 3; i++) ctx.fillRect(px + 4, py + 4 + i * 8.5, TS - 8, 7);
  ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 2; ctx.strokeRect(px + 3, py + 3, TS - 6, TS - 6);
  ctx.beginPath(); ctx.moveTo(px + 5, py + 5); ctx.lineTo(px + TS - 5, py + TS - 5); ctx.stroke();
  ctx.fillStyle = "#c9b48a"; [[5, 5], [25, 5], [5, 25], [25, 25]].forEach(([a, b]) => ctx.fillRect(px + a, py + b, 2, 2));
  if (hp < 2) { ctx.strokeStyle = "#2a1a0a"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px + 20, py + 4); ctx.lineTo(px + 16, py + 14); ctx.lineTo(px + 22, py + 20); ctx.stroke(); }
}
function drawDecor(d) {
  if (d.kind === "mush") {
    const p = 0.75 + 0.25 * Math.sin(time * 2 + d.ph);
    for (let i = 0; i < 3; i++) {
      const ox = [-6, 4, 0][i], oy = [2, 4, -4][i], s = [1, 0.8, 0.65][i];
      ctx.fillStyle = "#cfc4b0"; ctx.fillRect(d.x + ox - 1.5 * s, d.y + oy - 2, 3 * s, 7 * s);
      ctx.fillStyle = `rgba(70,230,235,${p})`; ctx.beginPath(); ctx.ellipse(d.x + ox, d.y + oy - 2, 6 * s, 4 * s, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillRect(d.x + ox - 2 * s, d.y + oy - 4 * s, 1.5, 1.5);
    }
  } else if (d.kind === "crystal") {
    const p = 0.7 + 0.3 * Math.sin(time * 2 + d.ph);
    const shard = (ox, h, w, a) => {
      ctx.save(); ctx.translate(d.x + ox, d.y + 8); ctx.rotate(a);
      ctx.fillStyle = `hsla(${d.hue},80%,${55 + p * 15}%,0.95)`;
      ctx.beginPath(); ctx.moveTo(-w, 0); ctx.lineTo(-w * 0.6, -h); ctx.lineTo(0, -h - 5); ctx.lineTo(w * 0.6, -h); ctx.lineTo(w, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.beginPath(); ctx.moveTo(-w * 0.3, -2); ctx.lineTo(-w * 0.2, -h); ctx.lineTo(0, -h - 4); ctx.closePath(); ctx.fill();
      ctx.restore();
    };
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(d.x, d.y + 9, 11, 3.5, 0, 0, 7); ctx.fill();
    shard(-6, 10, 3.5, -0.35); shard(6, 9, 3.5, 0.4); shard(0, 16, 4.5, 0);
  }
}
function drawTorch(tq) {
  const x = tq.x, y = tq.y + 6;
  ctx.fillStyle = "#5a3a1e"; ctx.fillRect(x - 2, y, 4, 9);
  ctx.fillStyle = "#3a2a1a"; ctx.fillRect(x - 4, y, 8, 3);
  const f = Math.sin(time * 14 + tq.ph) * 1.5;
  ctx.fillStyle = "#ff7a1a"; ctx.beginPath(); ctx.ellipse(x, y - 3, 4.5, 7 + f, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#ffe08a"; ctx.beginPath(); ctx.ellipse(x, y - 1, 2.2, 3.6 + f * 0.5, 0, 0, 7); ctx.fill();
  if (Math.random() < 0.08) parts.push({ x: x + rand(-2, 2), y: y - 8, vx: rand(-10, 10), vy: rand(-40, -20), life: 0.6, max: 0.6, c: "#ffb050", s: 1.5, glow: true });
}
function drawItem(it) {
  const b = Math.sin(it.t * 3) * 2.5;
  ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(it.x, it.y + 9, 8 - b * 0.5, 3, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(it.x, it.y + b - 2);
  if (it.kind === "key") {
    const c = KEYS[it.c].c;
    ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 3;

  const bossY = small ? 76 : 16;
  if (boss) {
    const bw = Math.min(420, VW - 40 - (settings.minimap && !small ? W * 3 + 30 : 0) - (small ? 0 : 140)), bx = VW / 2 - bw / 2;
    panel(bx - 6, bossY - 4, bw + 12, 36);
    ctx.fillStyle = "#f3e6c8"; ctx.font = `bold 11px ${TITLE_FONT}`; ctx.textAlign = "center"; ctx.fillText(boss.def.title, VW / 2, bossY + 9);
    ctx.fillStyle = "#3a1d22"; ctx.fillRect(bx, bossY + 15, bw, 10);
    ctx.fillStyle = boss.enraged ? "#ff3030" : "#e5484d"; ctx.fillRect(bx, bossY + 15, bw * Math.max(0, boss.hp / boss.maxHp), 10);
    ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillRect(bx, bossY + 15, bw * Math.max(0, boss.hp / boss.maxHp), 3);
  }
  // aviso
  if (toast.t > 0) {
    ctx.font = `bold ${small ? 13 : 16}px system-ui, sans-serif`; ctx.textAlign = "center";
    const tw = Math.min(VW - 24, ctx.measureText(toast.txt).width + 32), ty = (boss ? bossY + 66 : small ? 100 : 96) + (small && settings.minimap ? H * 2 + 10 : 0);
    ctx.globalAlpha = Math.min(1, toast.t * 2.5);
    panel(VW / 2 - tw / 2, ty - 22, tw, 34);
    ctx.fillStyle = "#f3e6c8"; ctx.fillText(toast.txt, VW / 2, ty, VW - 40);
    ctx.globalAlpha = 1;
  }
  // título del nivel
  if (banner > 0 && state === "play") {
    const a = Math.min(1, banner, (3.2 - banner) * 3);
    ctx.globalAlpha = a; ctx.textAlign = "center";
    ctx.fillStyle = "#e8a33d"; ctx.font = `bold ${small ? 13 : 16}px system-ui`;
    ctx.fillText(`— NIVEL ${levelIdx + 1} —`, VW / 2, VH * 0.36);
    ctx.fillStyle = "#f3e6c8"; ctx.font = `900 ${small ? 26 : 40}px ${TITLE_FONT}`;
    ctx.shadowColor = "rgba(232,163,61,0.6)"; ctx.shadowBlur = 18;
    ctx.fillText(LEVELS[levelIdx].name, VW / 2, VH * 0.36 + (small ? 36 : 50), VW - 32);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}
function drawSlot(id, x, y, slotW, num) {
  const have = P.weapons.includes(id), cur = curId() === id;
  panel(x, y, slotW, 56);
  if (cur) { ctx.strokeStyle = WEAPONS[id].color; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x, y, slotW, 56, 8); ctx.stroke(); }
  ctx.globalAlpha = have ? 1 : 0.18;
  ctx.save(); ctx.translate(x + slotW / 2, y + 22); drawGun(id, 1.4); ctx.restore();
  if (num) { ctx.fillStyle = "#f3e6c8"; ctx.font = "bold 10px system-ui"; ctx.textAlign = "left"; ctx.fillText(String(num), x + 5, y + 13); }
  if (have) {
    const w = WEAPONS[id], a = P.ammo[id];
    if (cur && P.reloading > 0) {
      const k = 1 - P.reloading / w.reload;
      ctx.fillStyle = "rgba(255,255,255,0.15)"; ctx.fillRect(x + 6, y + 44, slotW - 12, 5);
      ctx.fillStyle = "#3fb7ff"; ctx.fillRect(x + 6, y + 44, (slotW - 12) * k, 5);
    } else if (w.clip <= 6) {
      const pw = (slotW - 12) / w.clip;
      for (let i = 0; i < w.clip; i++) { ctx.fillStyle = i < a ? w.color : "rgba(255,255,255,0.15)"; ctx.fillRect(x + 6 + i * pw, y + 43, pw - 2, 6); }
    } else {
      ctx.textAlign = "center"; ctx.font = "bold 11px system-ui"; ctx.fillStyle = a === 0 ? "#e5484d" : "#f3e6c8";
      ctx.fillText(`${a}/${w.clip}`, x + slotW / 2, y + 49);
    }
  }
  ctx.globalAlpha = 1;
}
function drawTouch() {
  const B = btns();
  if (touch.joy) {
    ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.beginPath(); ctx.arc(touch.joy.ox, touch.joy.oy, 50, 0, 7); ctx.fill();
    const jx = touch.joy.x - touch.joy.ox, jy = touch.joy.y - touch.joy.oy, jd = Math.hypot(jx, jy), k = Math.min(1, 50 / (jd || 1));
    ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.beginPath(); ctx.arc(touch.joy.ox + jx * k, touch.joy.oy + jy * k, 22, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = "rgba(243,230,200,0.35)"; ctx.font = "12px system-ui"; ctx.textAlign = "left"; ctx.fillText("Desliza aquí para moverte", 16, VH - 20);
  }
  const btn = (b, label, c, k = 1) => {
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = `bold ${Math.round(b.r * 0.38)}px system-ui`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(label, b.x, b.y); ctx.textBaseline = "alphabetic";
  };
  btn(B.fire, "DISPARA", touch.fire ? "rgba(255,138,31,0.75)" : "rgba(255,138,31,0.4)");
  if (touch.fire && touch.aim !== null) { ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(B.fire.x, B.fire.y); ctx.lineTo(B.fire.x + Math.cos(touch.aim) * B.fire.r, B.fire.y + Math.sin(touch.aim) * B.fire.r); ctx.stroke(); }
  btn(B.dash, "ESQUIVA", "rgba(155,225,93,0.35)", P.dashCd > 0 ? 1 - P.dashCd / 0.8 : 1);
  btn(B.swap, "ARMA", "rgba(63,183,255,0.35)");
  btn(B.reload, "R", "rgba(255,255,255,0.15)");
  btn(B.pause, "II", "rgba(255,255,255,0.12)");
}

// Botones de menú (ratón, toque o teclado con flechas + Enter/Espacio)
function button(label, x, y, w, h, fn, opts = {}) {
  const idx = ui.length;
  ui.push({ x, y, w, h, fn, lr: opts.lr });
  const sel = uiSel === idx;
  ctx.fillStyle = sel ? "rgba(232,163,61,0.22)" : "rgba(20,16,24,0.85)";
  ctx.strokeStyle = sel ? "#e8a33d" : "rgba(243,230,200,0.2)"; ctx.lineWidth = sel ? 2 : 1;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = sel ? "#ffe2a8" : "#f3e6c8"; ctx.font = `bold ${opts.size || 16}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2 + 1, w - 16); ctx.textBaseline = "alphabetic";
  if (opts.lr) { ctx.fillStyle = sel ? "#e8a33d" : "rgba(243,230,200,0.35)"; ctx.fillText("‹", x + 16, y + h / 2 + 6); ctx.fillText("›", x + w - 16, y + h / 2 + 6); }
}
function menuList(items, cx, y0, w = 280, h = 46, gap = 10) {
  if (uiSel >= items.length) uiSel = 0;
  items.forEach((it, i) => button(it.label, cx - w / 2, y0 + i * (h + gap), w, h, it.fn, it));
}
function titleText(txt, y, size, color = "#f3e6c8") {
  ctx.textAlign = "center"; ctx.fillStyle = color; ctx.font = `900 ${size}px ${TITLE_FONT}`;
  ctx.shadowColor = "rgba(232,163,61,0.55)"; ctx.shadowBlur = 22;
  ctx.fillText(txt, VW / 2, y, VW - 24); ctx.shadowBlur = 0;
}
function dim(a = 0.75) { ctx.fillStyle = `rgba(5,4,7,${a})`; ctx.fillRect(0, 0, VW, VH); }
const sm = () => VW < 560 || VH < 560;
const toggleDiff = (d = 1) => { settings.diff = (settings.diff + d + DIFFS.length) % DIFFS.length; store.set("diff", settings.diff); };
const toMenu = () => { state = "title"; uiSel = 0; saved = store.get("save", null); };

function drawPause() {
  dim(0.72);
  const s = sm();
  titleText("PAUSA", VH * 0.2, s ? 34 : 50);
  menuList([
    { label: "Continuar", fn: resume },
    { label: "Reiniciar nivel", fn: () => loadLevel(levelIdx, true) },
    { label: `Minimapa: ${settings.minimap ? "Sí" : "No"}`, fn: () => { settings.minimap = !settings.minimap; store.set("minimap", settings.minimap); } },
    { label: `Sonido: ${settings.sound ? "Sí" : "No"}`, fn: () => setSound(!settings.sound) },
    { label: "Salir al menú", fn: toMenu },
  ], VW / 2, VH * 0.2 + 30, Math.min(300, VW - 40), s ? 40 : 46, 8);
  if (!touch.on) {
    ctx.fillStyle = "rgba(243,230,200,0.55)"; ctx.font = "13px system-ui"; ctx.textAlign = "center";
    const y = VH * 0.2 + 30 + 5 * 54 + 24;
    ["ESPACIO o clic: disparar  ·  WASD/flechas: moverse  ·  SHIFT o clic derecho: esquivar",
     "1-4 / Q / rueda: cambiar arma  ·  R: recargar  ·  TAB: minimapa  ·  M: sonido  ·  P/Esc: pausa"]
      .forEach((l, i) => ctx.fillText(l, VW / 2, y + i * 20, VW - 24));
  }
}
function statLine(label, val, y, ok) {
  const w = Math.min(380, VW - 40), x = VW / 2 - w / 2;
  ctx.font = `${sm() ? 14 : 16}px system-ui`; ctx.textAlign = "left"; ctx.fillStyle = "rgba(243,230,200,0.75)"; ctx.fillText(label, x, y);
  ctx.textAlign = "right"; ctx.fillStyle = ok === undefined ? "#f3e6c8" : ok ? "#9be15d" : "#f3e6c8"; ctx.font = `bold ${sm() ? 14 : 16}px system-ui`; ctx.fillText(val, x + w, y);
}
const mmss = t => `${Math.floor(t / 60)}:${Math.floor(t % 60).toString().padStart(2, "0")}`;
function drawStars(n, y, size = 30) {
  for (let i = 0; i < 3; i++) {
    const on = i < n, x = VW / 2 + (i - 1) * size * 1.4, pop = on ? 1 + Math.max(0, Math.sin(time * 3 - i * 0.6)) * 0.08 : 1;
    ctx.fillStyle = on ? "#ffd23f" : "rgba(243,230,200,0.15)";
    if (on) { ctx.shadowColor = "rgba(255,210,63,0.7)"; ctx.shadowBlur = 16; }
    star(x, y, size * 0.55 * pop); ctx.shadowBlur = 0;
  }
}
function drawLevelDone() {
  dim(0.8);
  const s = sm(), y0 = VH * (s ? 0.14 : 0.16);
  ctx.textAlign = "center"; ctx.fillStyle = "#e8a33d"; ctx.font = `bold ${s ? 13 : 15}px system-ui`;
  ctx.fillText(`NIVEL ${levelIdx + 1} COMPLETADO`, VW / 2, y0);
  titleText(LEVELS[levelIdx].name, y0 + (s ? 36 : 48), s ? 24 : 36);
  drawStars(lv.stars, y0 + (s ? 80 : 104), s ? 26 : 34);
  let y = y0 + (s ? 128 : 160); const lh = s ? 26 : 30;
  statLine("Monstruos", `${lv.kills} / ${lv.monTotal}`, y, lv.kills >= lv.monTotal * 0.8); y += lh;
  statLine("Oro encontrado", `${lv.goldGot} / ${lv.goldTotal}`, y, lv.goldGot >= lv.goldTotal * 0.8); y += lh;
  statLine("Secretos", `${lv.secrets} / ${lv.secretTotal}`, y, lv.secrets >= lv.secretTotal); y += lh;
  statLine("Tiempo", mmss(lv.time), y); y += lh;
  statLine("Bonus de rapidez", `+${lv.bonus}`, y); y += lh;
  statLine("Puntos totales", String(run.score), y); y += lh;
  menuList([{ label: "Siguiente nivel ›", fn: () => loadLevel(levelIdx + 1) }, { label: "Salir al menú", fn: toMenu }], VW / 2, y + 6, Math.min(300, VW - 40), s ? 40 : 46, 8);
}
function drawDead() {
  dim(0.75);
  const s = sm();
  titleText("¡TE HAN ATRAPADO!", VH * 0.3, s ? 28 : 46, "#ff6b6b");
  ctx.fillStyle = "rgba(243,230,200,0.75)"; ctx.font = `${s ? 13 : 16}px system-ui`; ctx.textAlign = "center";
  ctx.fillText("Consejo: " + deathTip, VW / 2, VH * 0.3 + 40, VW - 32);
  menuList([{ label: "Reintentar nivel", fn: () => loadLevel(levelIdx, true) }, { label: "Salir al menú", fn: toMenu }], VW / 2, VH * 0.3 + 70, Math.min(300, VW - 40), s ? 42 : 48, 10);
}
function drawWin() {
  dim(0.8);
  const s = sm(), y0 = VH * 0.16;
  for (let i = 0; i < 3; i++) if (Math.random() < 0.3) parts.push({ x: camX + rand(0, VW / ZOOM), y: camY + rand(0, VH / ZOOM * 0.5), vx: rand(-60, 60), vy: rand(-60, 60), life: 1, max: 1, c: ["#ff4fa3", "#ffd23f", "#3fb7ff", "#9be15d"][i], s: 3 });
  titleText("¡ESCAPASTE DEL ABISMO!", y0 + 20, s ? 24 : 44, "#ffd23f");
  ctx.textAlign = "center"; ctx.fillStyle = "rgba(243,230,200,0.75)"; ctx.font = `${s ? 13 : 16}px system-ui`;
  ctx.fillText("El Rey Ogro ha caído y la luz del sol vuelve a brillar.", VW / 2, y0 + 56, VW - 32);
  let y = y0 + (s ? 100 : 110); const lh = s ? 26 : 30;
  statLine("Dificultad", DIFF().name, y); y += lh;
  statLine("Monstruos derrotados", String(run.kills), y); y += lh;
  statLine("Oro", String(run.gold), y); y += lh;
  statLine("Secretos", String(run.secrets), y); y += lh;
  statLine("Estrellas", `${run.stars} / ${LEVELS.length * 3}`, y); y += lh;
  statLine("Tiempo total", mmss(run.time), y); y += lh;
  statLine(lv.record ? "¡NUEVO RÉCORD!" : "Puntos", String(run.score), y, lv.record); y += lh;
  if (!lv.record) { statLine("Récord", String(best), y); y += lh; }
  menuList([{ label: "Jugar de nuevo", fn: newGame }, { label: "Menú principal", fn: toMenu }], VW / 2, y + 6, Math.min(300, VW - 40), s ? 40 : 46, 8);
}

// ---------- Pantalla de título ----------
const embers = Array.from({ length: 80 }, () => ({ x: Math.random(), y: Math.random(), s: rand(1, 3), v: rand(0.02, 0.08), p: Math.random() * 7 }));
function cave(yBase, amp, seed, color, top) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(0, top ? 0 : VH);
  for (let x = 0; x <= VW + 20; x += 20) {
    const n = Math.sin(x * 0.013 + seed) * 0.5 + Math.sin(x * 0.037 + seed * 2) * 0.3 + hash(Math.floor(x / 20), seed) * 0.4;
    ctx.lineTo(x, yBase + (top ? 1 : -1) * n * amp);
  }
  ctx.lineTo(VW, top ? 0 : VH); ctx.closePath(); ctx.fill();
}
function drawTitle() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createRadialGradient(VW / 2, VH * 0.45, 0, VW / 2, VH * 0.45, Math.max(VW, VH) * 0.7);
  g.addColorStop(0, "#2e1c10"); g.addColorStop(0.5, "#130c08"); g.addColorStop(1, "#050407");
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  cave(VH * 0.08, 50, 1, "#0d0907", true);
  cave(VH * 0.04, 30, 4, "#070504", true);
  cave(VH * 0.93, 50, 7, "#0d0907", false);
  cave(VH * 0.97, 30, 9, "#070504", false);
  for (const e of embers) {
    e.y -= e.v * 0.016; if (e.y < -0.05) { e.y = 1.05; e.x = Math.random(); }
    ctx.globalAlpha = 0.4 + 0.4 * Math.sin(time * 3 + e.p);
    ctx.fillStyle = e.s > 2 ? "#ff8a1f" : "#3fb7ff";
    ctx.save(); ctx.translate(e.x * VW + Math.sin(time + e.p) * 10, e.y * VH); ctx.rotate(Math.sin(time + e.p)); ctx.fillRect(-e.s * 1.5, -e.s / 2, e.s * 3, e.s); ctx.restore();
  }
  ctx.globalAlpha = 1;
  const s = sm();
  const ty = VH * (s ? 0.14 : 0.17);
  ctx.textAlign = "center"; ctx.fillStyle = "#ff8a1f"; ctx.font = `bold ${s ? 12 : 15}px system-ui`;
  ctx.fillText("· UNA AVENTURA BAJO TIERRA ·", VW / 2, ty);
  const tg = ctx.createLinearGradient(0, ty + 10, 0, ty + (s ? 60 : 90));
  tg.addColorStop(0, "#fff1cf"); tg.addColorStop(1, "#e8a33d");
  ctx.font = `900 ${s ? 42 : 78}px ${TITLE_FONT}`; ctx.fillStyle = tg;
  ctx.shadowColor = "rgba(255,138,31,0.5)"; ctx.shadowBlur = 30;
  ctx.fillText("ABISMO NERF", VW / 2, ty + (s ? 52 : 84), VW - 24); ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(243,230,200,0.75)"; ctx.font = `${s ? 13 : 16}px system-ui`;
  ctx.fillText("10 niveles: encuentra las llaves, abre las puertas y derrota al Rey Ogro.", VW / 2, ty + (s ? 80 : 120), VW - 24);

  // lanzadores girando
  ctx.save(); ctx.translate(VW / 2 - (s ? 75 : 105), ty + (s ? 112 : 168));
  ORDER.forEach((id, i) => { ctx.save(); ctx.translate(i * (s ? 50 : 70), 0); ctx.rotate(Math.sin(time * 2 + i) * 0.15); drawGun(id, s ? 1.5 : 2); ctx.restore(); });
  ctx.restore();

  const items = [];
  if (saved && saved.level > 0) items.push({ label: `Continuar · Nivel ${saved.level + 1} (${DIFFS[saved.diff].name})`, fn: continueGame });
  items.push({ label: "Nueva partida", fn: newGame });
  items.push({ label: `Dificultad: ${DIFF().name}`, fn: () => toggleDiff(1), lr: toggleDiff });
  items.push({ label: `Sonido: ${settings.sound ? "Sí" : "No"}`, fn: () => setSound(!settings.sound) });
  const bh = s ? 40 : 46;
  menuList(items, VW / 2, ty + (s ? 140 : 205), Math.min(340, VW - 40), bh, 8);

  const yb = ty + (s ? 140 : 205) + items.length * (bh + 8) + 18;
  ctx.textAlign = "center"; ctx.fillStyle = "rgba(243,230,200,0.55)"; ctx.font = `${s ? 12 : 14}px system-ui`;
  const lines = touch.on || isTouch()
    ? ["Joystick a la izquierda · DISPARA a la derecha", "(arrastra DISPARA para apuntar) · ESQUIVA · ARMA"]
    : ["ESPACIO: disparar  ·  WASD/flechas: moverse  ·  SHIFT: esquivar",
       "Ratón: apuntar y disparar  ·  1-4/Q: cambiar arma  ·  R: recargar  ·  P: pausa"];
  lines.forEach((l, i) => ctx.fillText(l, VW / 2, yb + i * 20, VW - 24));
  if (best > 0) { ctx.fillStyle = "#f5c542"; ctx.font = `bold ${s ? 12 : 14}px system-ui`; ctx.fillText(`Récord: ${best} puntos`, VW / 2, yb + 50); }
}

// ---------- Bucle ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
