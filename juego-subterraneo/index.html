  { t: "Coge la llave roja y abre la puerta roja", ok: () => tut.door },

  { t: "Baja por la escalera para empezar la aventura", ok: () => false },
];
const curDef = () => inTutorial ? TUTORIAL : LEVELS[levelIdx];
function startTutorial() {
  freshRun(); inTutorial = true; tutStep = 0; tutDone = 0;
  tut = { moved: false, dummies: 0, crate: false, switched: false, reloaded: false, dashed: false, ability: false, door: false, slime: false, sx: 0, sy: 0 };
  loadLevel(0);
  tut.sx = P.x; tut.sy = P.y;
}
function endTutorial() {
  inTutorial = false; store.set("tutorialDone", true);
  newGame();
  showToast("¡Tutorial completado! Comienza la aventura", 3.5);
}
function updateTutorial(dt) {
  if (!inTutorial) return;
  if (!tut.moved && Math.hypot(P.x - tut.sx, P.y - tut.sy) > 90) tut.moved = true;
  tutDone = Math.max(0, tutDone - dt);
  while (tutStep < TUT_STEPS.length - 1 && TUT_STEPS[tutStep].ok()) {
    tutStep++; tutDone = 1;
    jingle([76, 81], 0.08, "triangle", 0.05);
    rings.push({ x: P.x, y: P.y, r: 6, max: 40, life: 0.4, c: "#9be15d" });
  }
}
function drawTutorialPanel() {
  if (!inTutorial) return;
  const st = TUT_STEPS[tutStep], txt = isTouch() && st.m ? st.m : st.t, s = VW < 560, w = s ? Math.min(240, VW * 0.62) : 330, x = 10, y = 76;
  ctx.font = `bold ${s ? 12 : 14}px system-ui`;
  const lines = wrapText(txt, w - 46), h = 34 + lines.length * (s ? 15 : 18);
  const pop = 1 + tutDone * 0.08;
  ctx.save(); ctx.translate(x, y); ctx.scale(pop, pop);
  panel(0, 0, w, h, 10);
  ctx.strokeStyle = tutDone > 0 ? "#9be15d" : "rgba(155,225,93,0.5)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(0, 0, w, h, 10); ctx.stroke();
  ctx.fillStyle = "#9be15d"; ctx.font = `bold ${s ? 10 : 11}px system-ui`; ctx.textAlign = "left";
  ctx.fillText(`TUTORIAL · ${tutStep + 1}/${TUT_STEPS.length}`, 12, 16);
  ctx.fillStyle = "rgba(155,225,93,0.25)"; ctx.fillRect(12, 22, w - 24, 3); ctx.fillStyle = "#9be15d"; ctx.fillRect(12, 22, (w - 24) * tutStep / (TUT_STEPS.length - 1), 3);
  ctx.fillStyle = "#fff3dc"; ctx.font = `bold ${s ? 12 : 14}px system-ui`;
  lines.forEach((l, i) => ctx.fillText(l, 34, 42 + i * (s ? 15 : 18)));
  ctx.strokeStyle = "#9be15d"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(20, 37, 6, 0, 7); ctx.stroke();
  ctx.restore();
}

function startAmbience() {

  const g = AC.createGain(); g.gain.value = 0.045; lp.connect(g).connect(musBus);
  for (const f of [55, 55.7, 82.4]) { const o = AC.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(lp); o.start(); }
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 110; lfo.connect(lg).connect(lp.frequency); lfo.start();
}

function updateAudio(dt) {
  if (!AC) return;
  updateMusic(dt);

  if (dripT <= 0) {
    dripT = rand(1.5, 5);
    const f = rand(900, 1700);
    beep(f, 0.12, "sine", 0.025, -f * 0.6, musBus);
    if (Math.random() < 0.4) setTimeout(() => beep(f * 0.8, 0.1, "sine", 0.012, -f * 0.4, musBus), 260);
  }
  const boss = state === "play" && monsters.find(m => m.def.boss && m.alert > 0);
  if (boss) {
    musicT -= dt;
    if (musicT <= 0) {
      musicT = boss.hp < boss.maxHp / 2 ? 0.17 : 0.21;
      const n = BOSS_BASS[musicStep % 8];
      beep(n, 0.18, "sawtooth", 0.05, 0, musBus);
      if (musicStep % 4 === 0) { beep(110, 0.12, "sine", 0.1, -70, musBus); }
      if (musicStep % 8 === 6) noise(0.06, 0.04, 4000, "highpass", musBus);
      musicStep++;
    }
  }

}

const MUS = { mode: "", t: 0, step: 0 };
const LEVEL_ROOTS = [57, 50, 54, 52, 49, 55, 53, 48, 56, 45];
const MINOR_PENT = [0, 3, 5, 7, 10, 12, 15];
const TITLE_SONG = [[69, 1], [72, 1], [76, 2], [74, 1], [72, 1], [71, 2], [69, 1], [67, 1], [69, 2], [64, 2],

const END_MELODY = [72, 0, 76, 79, 0, 77, 76, 74, 72, 0, 74, 76, 0, 79, 77, 76];
function musicMode() {
  if (state === "title" || state === "custom" || state === "ach") return "title";
  if (state === "story") return story.pages === ENDING ? "ending" : "story";
  if (state === "win") return "ending";

}
function updateMusic(dt) {
  const mode = musicMode();

  MUS.t -= dt; if (MUS.t > 0) return;
  const st = MUS.step++;

    if (mode === "ending" && END_MELODY[st % 16]) tone(NOTE(END_MELODY[st % 16]), step * 1.8, "square", 0.018, 0.01, 2400);

  } else {
    if (state !== "play") { MUS.t = 0.5; return; }

    if (Math.random() < 0.7) tone(NOTE(root + 12 + MINOR_PENT[Math.floor(Math.random() * MINOR_PENT.length)]), 1.8, "sine", 0.02, 0.08);
    if (st % 8 === 0) tone(NOTE(root - 12), 3.6, "triangle", 0.03, 0.3, 600);
    MUS.t = rand(0.45, 0.85);

}
